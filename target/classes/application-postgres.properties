spring.datasource.url=jdbc:postgresql://localhost:5432/livemcq
spring.datasource.username=postgres
spring.datasource.password=postgres

# স্কিমা এখন Flyway চালায় (db/migration). Hibernate শুধু মিলিয়ে দেখে; না মিললে সার্ভার চালুই হবে না।
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# আগে ddl-auto=update দিয়ে বানানো ডাটাবেসে V1 বাদ দিয়ে বেসলাইন ধরে নেয়; খালি ডাটাবেসে V1 চলে
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
server.port=8080
