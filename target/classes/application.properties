server.port=8080

# ডিফল্ট: H2 ফাইল ডাটাবেস (কোনো সেটআপ লাগে না). PostgreSQL এর জন্য: --spring.profiles.active=postgres
spring.datasource.url=jdbc:h2:file:./data/livemcq;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Flyway শুধু postgres প্রোফাইলে চলে (H2-তে ddl-auto=update)
spring.flyway.enabled=false

# JWT: কমপক্ষে ৩২ অক্ষর. আসল ব্যবহারে environment variable থেকে দিন.
app.jwt.secret=${JWT_SECRET:change-this-secret-key-to-at-least-32-chars-long}
app.jwt.ttl-hours=12

# সময় শেষ হওয়া পরীক্ষা কত সেকেন্ড পরপর স্বয়ংক্রিয় জমা হবে
app.sweeper.interval-ms=5000
# দেরিতে আসা জমা কত সেকেন্ড পর্যন্ত গ্রহণযোগ্য (নেটওয়ার্ক দেরির জন্য)
app.submit.grace-seconds=3

# নিবন্ধনে কোড লাগাতে চাইলে দিন (খালি = সবাই নিবন্ধন করতে পারে). environment: REGISTRATION_CODE
app.registration.code=${REGISTRATION_CODE:}
# true = ডেমো ছাত্র/শিক্ষক/পরীক্ষা (admin/admin, t1/1234, 101/1234 ...). আসল ব্যবহারে false দিন এবং ADMIN_PASSWORD দিন.
app.seed.demo=${APP_SEED_DEMO:true}
app.admin.password=${ADMIN_PASSWORD:}
